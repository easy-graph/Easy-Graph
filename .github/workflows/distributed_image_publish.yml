name: Publish distributed EasyGraph Worker image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from setup.py, for example 1.6.4
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.repository == 'easy-graph/Easy-Graph'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Match image tag to Python package version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          source = pathlib.Path('setup.py').read_text()
          match = re.search(r'^\s*version="([^"]+)"', source, re.MULTILINE)
          assert match and match.group(1) == os.environ['RELEASE_VERSION']
          PY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: deploy/k8s/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/easy-graph/easygraph-distributed:${{ inputs.version }}
          provenance: true
          sbom: true
      - name: Record digest
        run: echo "ghcr.io/easy-graph/easygraph-distributed@${{ steps.image.outputs.digest }}"
