name: PR code review

on:
  workflow_dispatch:
  pull_request:
    branches:
      - pybind11
  push:
    branches:
      - pybind11

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest, macos-15-intel, macos-15]
        python-version: ["3.9", "3.12", "3.14", "3.15"]

    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Add requirements
      run: python -m pip install --upgrade setuptools wheel build packaging

    - name: Build and install
      run: pip install --verbose .

    - name: Check optional dependency and PyTorch wheel policy logic
      run: python -m unittest discover -s scripts/tests -p "test_*.py"

    - name: Smoke test
      run: python scripts/wheel_smoke.py
